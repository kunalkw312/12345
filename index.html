<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Simple YouTube Player — Minimal</title>
    <style>
      /* Ensure the player container stays clean and nothing else appears */
      body {
        margin: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      #player {
        width: 640px;
        height: 390px;
        background: #000;
      }
      /* Just in case any stray elements try to appear (they won't) */
      .action-menu-engagement-buttons-wrapper,
      .ytmVideoInfoVideoDetailsContainer,
      .watch-on-youtube-button,
      .ytdVolumeControlsMuteIconButton,
      .ytmFullscreenRelatedVideosEntryPointViewModelButton,
      .ytmSlimMetadataButtonRendererHost,
      button-view-model,
      ytm-button-renderer,
      ytm-slim-metadata-button-renderer {
        display: none !important;
        visibility: hidden !important;
        width: 0 !important;
        height: 0 !important;
        overflow: hidden !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <!-- 1. The API will replace this <div> with the YouTube <iframe> -->
    <div id="player"></div>

    <script>
      // 2. Load the YouTube IFrame Player API asynchronously
      var tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      // 3. Create the player after the API downloads
      var player;
      function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
          height: '390',
          width: '640',
          videoId: 'wE8s993ZV-8',
          playerVars: {
            'playsinline': 1,
            'rel': 0,
            'modestbranding': 1,
            'controls': 1,
            'showinfo': 0,
            'iv_load_policy': 3,
            'fs': 1,
            'disablekb': 0,
            'origin': window.location.origin
          },
          events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
          }
        });
      }

      // 4. Player ready — optionally start playback (comment out to stay paused)
      function onPlayerReady(event) {
        // Uncomment the next line if you want autoplay:
        // event.target.playVideo();
      }

      // 5. Extra guard: after player loads, aggressively remove any injected UI that might slip through
      function onPlayerStateChange(event) {
        // If the player enters playing state, run cleanup
        if (event.data === YT.PlayerState.PLAYING || event.data === YT.PlayerState.BUFFERING) {
          // Use a small timeout to let any overlays render, then remove them
          setTimeout(function() {
            // List of selectors matching the unwanted elements
            var unwantedSelectors = [
              '.action-menu-engagement-buttons-wrapper',
              '.ytmVideoInfoVideoDetailsContainer',
              'button-view-model.watch-on-youtube-button',
              '.ytdVolumeControlsMuteIconButton',
              '.ytmFullscreenRelatedVideosEntryPointViewModelButton',
              '.ytmSlimMetadataButtonRendererHost',
              '.ytmVideoInfoVideoDetailsContainer',
              'ytm-button-renderer',
              'ytm-slim-metadata-button-renderer',
              'button-view-model',
              '.ytmFullscreenRelatedVideosEntryPointViewModelButton'
            ];
            unwantedSelectors.forEach(function(sel) {
              try {
                var elements = document.querySelectorAll(sel);
                elements.forEach(function(el) {
                  if (el && el.parentNode) {
                    el.parentNode.removeChild(el);
                  }
                });
              } catch (e) {
                // Silently ignore any selector errors
              }
            });
            // Also remove any injected elements that match these classes inside the player iframe's parent
            // (though they normally reside outside, this is a safety net)
            var allDivs = document.querySelectorAll('div');
            allDivs.forEach(function(div) {
              if (div.className && typeof div.className === 'string') {
                var cls = div.className;
                if (cls.includes('action-menu-engagement-buttons-wrapper') ||
                    cls.includes('ytmVideoInfoVideoDetailsContainer') ||
                    cls.includes('watch-on-youtube-button') ||
                    cls.includes('ytdVolumeControlsMuteIconButton') ||
                    cls.includes('ytmFullscreenRelatedVideosEntryPointViewModelButton') ||
                    cls.includes('ytmSlimMetadataButtonRendererHost')) {
                  if (div.parentNode) {
                    div.parentNode.removeChild(div);
                  }
                }
              }
            });
          }, 500); // wait half a second for any UI to appear
        }
      }

      // Also run a periodic cleanup in case something loads later
      setInterval(function() {
        var unwanted = [
          '.action-menu-engagement-buttons-wrapper',
          '.ytmVideoInfoVideoDetailsContainer',
          'button-view-model.watch-on-youtube-button',
          '.ytdVolumeControlsMuteIconButton',
          '.ytmFullscreenRelatedVideosEntryPointViewModelButton',
          '.ytmSlimMetadataButtonRendererHost',
          '.ytmVideoInfoVideoDetailsContainer',
          'ytm-button-renderer',
          'ytm-slim-metadata-button-renderer',
          'button-view-model'
        ];
        unwanted.forEach(function(sel) {
          try {
            var els = document.querySelectorAll(sel);
            els.forEach(function(el) {
              if (el && el.parentNode) {
                el.parentNode.removeChild(el);
              }
            });
          } catch (e) {}
        });
        // Also remove any element with class containing 'ytmVideoInfo' or 'action-menu-engagement'
        var all = document.querySelectorAll('*');
        all.forEach(function(el) {
          if (el.className && typeof el.className === 'string') {
            if (el.className.includes('ytmVideoInfo') ||
                el.className.includes('action-menu-engagement') ||
                el.className.includes('watch-on-youtube') ||
                el.className.includes('ytdVolumeControls') ||
                el.className.includes('ytmFullscreenRelatedVideos') ||
                el.className.includes('ytmSlimMetadataButtonRenderer')) {
              if (el.parentNode) {
                el.parentNode.removeChild(el);
              }
            }
          }
        });
      }, 2000); // every 2 seconds

      // Extra immediate cleanup after page load
      window.addEventListener('load', function() {
        setTimeout(function() {
          var selectors = [
            '.action-menu-engagement-buttons-wrapper',
            '.ytmVideoInfoVideoDetailsContainer',
            'button-view-model.watch-on-youtube-button',
            '.ytdVolumeControlsMuteIconButton',
            '.ytmFullscreenRelatedVideosEntryPointViewModelButton',
            '.ytmSlimMetadataButtonRendererHost'
          ];
          selectors.forEach(function(s) {
            document.querySelectorAll(s).forEach(function(el) {
              if (el.parentNode) el.parentNode.removeChild(el);
            });
          });
        }, 1000);
      });
    </script>
  </body>
</html>
