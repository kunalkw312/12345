<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Simple YouTube Player - Clean End Screen</title>
    <style>
      /* Hide potential end-screen overlays (extra safety) */
      .ytp-ce-element, .ytp-endscreen-content, .ytp-ce-covering-overlay,
      .ytp-ce-video, .ytp-ce-playlist, .ytp-ce-channel, .ytp-ce-element,
      .ytmVideoInfoVideoDetailsContainer, .action-menu-engagement-buttons-wrapper,
      .watch-on-youtube-button, .ytdVolumeControlsMuteIconButton,
      .ytmFullscreenRelatedVideosEntryPointViewModelButton,
      .ytmSlimMetadataButtonRendererHost {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        overflow: hidden !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
      }
      /* Keep only the player visible and clean */
      body {
        margin: 0;
        padding: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      #player {
        width: 640px;
        height: 390px;
        background: #000;
      }
    </style>
  </head>
  <body>
    <!-- The API will replace this div with the YouTube iframe -->
    <div id="player"></div>

    <script>
      // 2. Load the YouTube IFrame Player API asynchronously
      var tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      // 3. This function creates the iframe and player after the API downloads
      var player;
      function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
          height: '390',
          width: '640',
          videoId: 'wE8s993ZV-8',
          playerVars: {
            'playsinline': 1,
            'rel': 0,
            'modestbranding': 1,
            'showinfo': 0,
            'iv_load_policy': 3,
            'controls': 1,
            'disablekb': 1,
            'fs': 0,
            'cc_load_policy': 0,
            'origin': window.location.origin
          },
          events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
          }
        });
      }

      // 4. The API calls this function when the player is fully ready
      function onPlayerReady(event) {
        // Player is ready. No autoplay.
        // Optional: force any dynamic elements to be hidden again
        hideYouTubeOverlays();
      }

      // 5. Block end-screen elements using multiple strategies
      function onPlayerStateChange(event) {
        // If video ends (state 0), immediately hide any overlays that may appear
        if (event.data === YT.PlayerState.ENDED) {
          hideYouTubeOverlays();
        }
        // Also hide on any state change as a precaution
        hideYouTubeOverlays();
      }

      // 6. Function to aggressively hide any end-screen elements
      function hideYouTubeOverlays() {
        // List of selectors to remove or hide
        const selectorsToHide = [
          '.action-menu-engagement-buttons-wrapper',
          '.ytmVideoInfoVideoDetailsContainer',
          '.watch-on-youtube-button',
          '.ytdVolumeControlsMuteIconButton',
          '.ytmFullscreenRelatedVideosEntryPointViewModelButton',
          '.ytmSlimMetadataButtonRendererHost',
          '.ytp-ce-element',
          '.ytp-endscreen-content',
          '.ytp-ce-covering-overlay',
          '.ytp-ce-video',
          '.ytp-ce-playlist',
          '.ytp-ce-channel',
          '.ytp-cards-teaser',
          '.ytp-suggested-action',
          '.ytp-pause-overlay',
          '.ytp-scroll-min',
          '.ytp-ce-element-shadow',
          '.ytp-ce-covering-shadow-top',
          '.ytp-ce-covering-shadow-bottom',
          '.ytp-ce-channel-thumbnail',
          '.ytp-ce-video-title',
          '.ytp-ce-channel-title',
          '.ytp-ce-playlist-title'
        ];

        selectorsToHide.forEach(selector => {
          document.querySelectorAll(selector).forEach(el => {
            if (el) {
              el.style.display = 'none';
              el.style.visibility = 'hidden';
              el.style.opacity = '0';
              el.style.pointerEvents = 'none';
              el.style.width = '0';
              el.style.height = '0';
              el.style.overflow = 'hidden';
              el.style.position = 'absolute';
              el.style.top = '-9999px';
              el.style.left = '-9999px';
            }
          });
        });

        // Also try to remove elements from the DOM if they are inside the iframe
        // (Note: cross-origin iframe content cannot be accessed directly, but the CSS
        //  in the iframe's own document might be affected if we inject styles.
        //  However, we can't inject into the iframe due to same-origin policy.
        //  So we rely on the playerVars and CSS above. The playerVars 'rel=0' and
        //  'modestbranding=1' help reduce related videos, but end screen overlays
        //  are controlled by YouTube and may still appear. We do our best with
        //  the available methods.)

        // Additionally, if the iframe is present, try to hide elements via postMessage?
        // Not reliable. So we just hide any elements that might be created in the parent
        // document by the API (unlikely, but just in case).
      }

      // 7. Run hideYouTubeOverlays periodically to catch dynamically added elements
      //    (especially when the video ends, the API may add elements)
      setInterval(hideYouTubeOverlays, 500);

      // 8. Also run on window load and after a short delay to ensure everything is hidden
      window.addEventListener('load', function() {
        hideYouTubeOverlays();
        setTimeout(hideYouTubeOverlays, 1000);
        setTimeout(hideYouTubeOverlays, 3000);
      });

      // 9. MutationObserver to watch for any added nodes and hide them immediately
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.addedNodes.length > 0) {
            hideYouTubeOverlays();
          }
        });
      });

      // Start observing the document body for added nodes
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });

      // 10. Also try to disable related videos via YouTube API (already set rel=0)
      //    and prevent autoplay of next video.
    </script>
  </body>
</html>
