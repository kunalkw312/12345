<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Simple YouTube Player</title>
  </head>
  <body>
    <!-- 1. The API will replace this <div> with the YouTube <iframe> -->
    <div id="player"></div>

    <script>
      // 2. Load the YouTube IFrame Player API asynchronously
      var tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      // 3. This function creates the <iframe> and player after the API downloads
      var player;
      function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
          height: '390', // Player height in pixels
          width: '640',  // Player width in pixels
          videoId: 'wE8s993ZV-8', // Your specific video ID
          playerVars: {
            'playsinline': 1, // Standard setting for mobile compatibility
            'rel': 0          // Suggest related videos from the same channel
          },
          events: {
            'onReady': onPlayerReady
          }
        });
      }

      // 4. The API calls this function when the player is fully ready
      function onPlayerReady(event) {
        // The player is ready. 
        // If you want it to autoplay instantly, uncomment the line below:
        // event.target.playVideo();
      }
    </script>
  </body>
</html>
